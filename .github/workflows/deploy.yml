name: CI/CD Pipeline — Test, Build & Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-and-push:
    name: CI/CD (Test -> Build -> Docker Hub)
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests (CI Quality Gate)
        run: npm run test

      - name: Build NestJS application
        run: npm run build

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build optimized multi-stage Docker image
        run: |
          OWNER="${DOCKERHUB_USERNAME:-local}"
          docker build --target production \
            -t "$OWNER/nestjs-lab19-app:${{ github.sha }}" \
            -t "$OWNER/nestjs-lab19-app:latest" .

      - name: Push Docker image to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          docker push "$DOCKERHUB_USERNAME/nestjs-lab19-app:${{ github.sha }}"
          docker push "$DOCKERHUB_USERNAME/nestjs-lab19-app:latest"
